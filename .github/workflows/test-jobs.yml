on: [push]
jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - run: echo "A" > note.txt
      - run: cat note.txt
      - name: Save note.txt
        uses: actions/upload-artifact@v4
        with:
          name: shared-note
          path: note.txt

  two:
    runs-on: ubuntu-latest
    needs: one
    steps:
      - name: Download note.txt
        uses: actions/download-artifact@v4
        with:
          name: shared-note
      - run: cat note.txt
